<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player | CodeAlpha Task 4</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Music Player Container */
        .music-player {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 30px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        /* Album Art */
        .album-art {
            text-align: center;
            margin-bottom: 25px;
        }

        .album-circle {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: rotate 20s linear infinite;
            animation-play-state: paused;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .album-circle i {
            font-size: 80px;
            color: white;
        }

        /* Song Info */
        .song-info {
            text-align: center;
            margin-bottom: 25px;
        }

        .song-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .artist-name {
            font-size: 0.9rem;
            color: #667eea;
            font-weight: 500;
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: #e0e0e0;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 5px;
            position: relative;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.8rem;
            color: #666;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: white;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: #667eea;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .control-btn:hover {
            transform: scale(1.1);
            background: #667eea;
            color: white;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 1.5rem;
        }

        .play-btn:hover {
            transform: scale(1.1);
        }

        /* Volume Control */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .volume-container i {
            color: #667eea;
            cursor: pointer;
        }

        .volume-slider {
            flex: 1;
            height: 4px;
            background: #e0e0e0;
            border-radius: 5px;
            cursor: pointer;
        }

        .volume-level {
            width: 70%;
            height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 5px;
        }

        /* Playlist */
        .playlist {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .playlist-header h3 {
            font-size: 1rem;
            color: #333;
        }

        .playlist-toggle {
            color: #667eea;
            transition: 0.3s;
        }

        .playlist-items {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .playlist-items.show {
            max-height: 300px;
            overflow-y: auto;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 5px;
        }

        .playlist-item:hover {
            background: #f0f0f0;
        }

        .playlist-item.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .playlist-item.active .playlist-song {
            color: white;
        }

        .playlist-song {
            font-size: 0.9rem;
            color: #333;
        }

        .playlist-artist {
            font-size: 0.7rem;
            color: #888;
        }

        .playlist-item.active .playlist-artist {
            color: rgba(255,255,255,0.8);
        }

        /* Scrollbar */
        .playlist-items::-webkit-scrollbar {
            width: 5px;
        }

        .playlist-items::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 5px;
        }

        .playlist-items::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 5px;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 0.7rem;
            color: #888;
        }
    </style>
</head>
<body>

<div class="music-player">
    <!-- Album Art -->
    <div class="album-art">
        <div class="album-circle" id="albumCircle">
            <i class="fas fa-music" id="albumIcon"></i>
        </div>
    </div>

    <!-- Song Info -->
    <div class="song-info">
        <div class="song-title" id="songTitle">Shape of You</div>
        <div class="artist-name" id="artistName">Ed Sheeran</div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container">
        <div class="progress-bar" id="progressBar">
            <div class="progress" id="progress"></div>
        </div>
        <div class="time-info">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="control-btn" id="prevBtn">
            <i class="fas fa-backward"></i>
        </button>
        <button class="control-btn play-btn" id="playBtn">
            <i class="fas fa-play"></i>
        </button>
        <button class="control-btn" id="nextBtn">
            <i class="fas fa-forward"></i>
        </button>
    </div>

    <!-- Volume Control -->
    <div class="volume-container">
        <i class="fas fa-volume-up" id="volumeIcon"></i>
        <div class="volume-slider" id="volumeBar">
            <div class="volume-level" id="volumeLevel"></div>
        </div>
    </div>

    <!-- Playlist -->
    <div class="playlist">
        <div class="playlist-header" id="playlistToggle">
            <h3><i class="fas fa-list"></i> Playlist</h3>
            <i class="fas fa-chevron-down playlist-toggle" id="playlistIcon"></i>
        </div>
        <div class="playlist-items" id="playlistItems">
            <!-- Playlist will be added here by JS -->
        </div>
    </div>

    <div class="footer">
        <p>🎵 CodeAlpha Music Player | Enjoy the music! 🎵</p>
    </div>
</div>

<script>
    // Song Library
    const songs = [
        {
            title: "Shape of You",
            artist: "Ed Sheeran",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
            duration: "3:54"
        },
        {
            title: "Blinding Lights",
            artist: "The Weeknd",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
            duration: "3:20"
        },
        {
            title: "Dance Monkey",
            artist: "Tones and I",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
            duration: "3:29"
        },
        {
            title: "Believer",
            artist: "Imagine Dragons",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
            duration: "3:24"
        },
        {
            title: "Someone Like You",
            artist: "Adele",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",
            duration: "4:45"
        },
        {
            title: "Uptown Funk",
            artist: "Mark Ronson ft. Bruno Mars",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3",
            duration: "4:30"
        },
        {
            title: "Perfect",
            artist: "Ed Sheeran",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3",
            duration: "4:23"
        },
        {
            title: "Bad Guy",
            artist: "Billie Eilish",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3",
            duration: "3:14"
        }
    ];

    // DOM Elements
    const audio = new Audio();
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const songTitle = document.getElementById('songTitle');
    const artistName = document.getElementById('artistName');
    const progressBar = document.getElementById('progressBar');
    const progress = document.getElementById('progress');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const volumeBar = document.getElementById('volumeBar');
    const volumeLevel = document.getElementById('volumeLevel');
    const volumeIcon = document.getElementById('volumeIcon');
    const albumCircle = document.getElementById('albumCircle');
    const albumIcon = document.getElementById('albumIcon');
    const playlistItems = document.getElementById('playlistItems');
    const playlistToggle = document.getElementById('playlistToggle');
    const playlistIconElem = document.getElementById('playlistIcon');

    // Variables
    let currentSongIndex = 0;
    let isPlaying = false;
    let isPlaylistOpen = false;

    // Load Song
    function loadSong(index) {
        const song = songs[index];
        songTitle.textContent = song.title;
        artistName.textContent = song.artist;
        audio.src = song.url;
        durationSpan.textContent = song.duration;
        
        // Update active playlist item
        document.querySelectorAll('.playlist-item').forEach((item, i) => {
            if (i === index) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });
        
        // Reset progress
        progress.style.width = '0%';
        currentTimeSpan.textContent = '0:00';
    }

    // Play Song
    function playSong() {
        audio.play();
        isPlaying = true;
        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        albumCircle.style.animationPlayState = 'running';
    }

    // Pause Song
    function pauseSong() {
        audio.pause();
        isPlaying = false;
        playBtn.innerHTML = '<i class="fas fa-play"></i>';
        albumCircle.style.animationPlayState = 'paused';
    }

    // Toggle Play/Pause
    function togglePlay() {
        if (isPlaying) {
            pauseSong();
        } else {
            playSong();
        }
    }

    // Next Song
    function nextSong() {
        currentSongIndex = (currentSongIndex + 1) % songs.length;
        loadSong(currentSongIndex);
        if (isPlaying) {
            playSong();
        }
    }

    // Previous Song
    function prevSong() {
        currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
        loadSong(currentSongIndex);
        if (isPlaying) {
            playSong();
        }
    }

    // Update Progress Bar
    function updateProgress() {
        if (audio.duration) {
            const progressPercent = (audio.currentTime / audio.duration) * 100;
            progress.style.width = `${progressPercent}%`;
            
            // Update current time
            const minutes = Math.floor(audio.currentTime / 60);
            const seconds = Math.floor(audio.currentTime % 60);
            currentTimeSpan.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }
    }

    // Set Progress
    function setProgress(e) {
        const width = this.clientWidth;
        const clickX = e.offsetX;
        const duration = audio.duration;
        audio.currentTime = (clickX / width) * duration;
    }

    // Set Volume
    function setVolume(e) {
        const width = this.clientWidth;
        const clickX = e.offsetX;
        const volume = clickX / width;
        audio.volume = Math.min(1, Math.max(0, volume));
        volumeLevel.style.width = `${volume * 100}%`;
        
        // Update volume icon
        if (audio.volume === 0) {
            volumeIcon.className = 'fas fa-volume-mute';
        } else if (audio.volume < 0.5) {
            volumeIcon.className = 'fas fa-volume-down';
        } else {
            volumeIcon.className = 'fas fa-volume-up';
        }
    }

    // Toggle Mute
    function toggleMute() {
        if (audio.volume > 0) {
            audio.volume = 0;
            volumeLevel.style.width = '0%';
            volumeIcon.className = 'fas fa-volume-mute';
        } else {
            audio.volume = 0.7;
            volumeLevel.style.width = '70%';
            volumeIcon.className = 'fas fa-volume-up';
        }
    }

    // Load Playlist
    function loadPlaylist() {
        let html = '';
        songs.forEach((song, index) => {
            html += `
                <div class="playlist-item" data-index="${index}">
                    <div>
                        <div class="playlist-song">${song.title}</div>
                        <div class="playlist-artist">${song.artist}</div>
                    </div>
                    <i class="fas fa-music" style="font-size: 0.8rem;"></i>
                </div>
            `;
        });
        playlistItems.innerHTML = html;
        
        // Add click events to playlist items
        document.querySelectorAll('.playlist-item').forEach(item => {
            item.addEventListener('click', () => {
                const index = parseInt(item.getAttribute('data-index'));
                currentSongIndex = index;
                loadSong(currentSongIndex);
                if (isPlaying) {
                    playSong();
                } else {
                    playSong();
                }
            });
        });
    }

    // Toggle Playlist
    function togglePlaylist() {
        isPlaylistOpen = !isPlaylistOpen;
        if (isPlaylistOpen) {
            playlistItems.classList.add('show');
            playlistIconElem.className = 'fas fa-chevron-up playlist-toggle';
        } else {
            playlistItems.classList.remove('show');
            playlistIconElem.className = 'fas fa-chevron-down playlist-toggle';
        }
    }

    // Event Listeners
    playBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextSong);
    prevBtn.addEventListener('click', prevSong);
    progressBar.addEventListener('click', setProgress);
    volumeBar.addEventListener('click', setVolume);
    volumeIcon.addEventListener('click', toggleMute);
    playlistToggle.addEventListener('click', togglePlaylist);
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('ended', nextSong);
    audio.addEventListener('loadedmetadata', () => {
        durationSpan.textContent = `${Math.floor(audio.duration / 60)}:${Math.floor(audio.duration % 60).toString().padStart(2, '0')}`;
    });

    // Set default volume
    audio.volume = 0.7;
    volumeLevel.style.width = '70%';

    // Initial load
    loadSong(0);
    loadPlaylist();

    // Change album icon based on song
    function updateAlbumIcon() {
        const icons = ['fa-music', 'fa-headphones', 'fa-guitar', 'fa-drum', 'fa-microphone'];
        const randomIcon = icons[Math.floor(Math.random() * icons.length)];
        albumIcon.className = `fas ${randomIcon}`;
    }
    
    setInterval(updateAlbumIcon, 5000);
</script>
</body>
</html>
